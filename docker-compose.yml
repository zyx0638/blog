services:
  blog:
    image: blog:latest
    build: .
    restart: unless-stopped
    init: true
    ports:
      # 只监听本机，由 nginx 反代对外提供 HTTPS
      - "127.0.0.1:3000:3000"
    environment:
      # 部署前务必改成自己的值（与本地 .env.local 无关）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DB_PATH: ${DB_PATH:-/app/data/blog.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      # Bangumi / QQ 音乐代理按需填写，留空表示直连
      BANGUMI_PROXY: ${BANGUMI_PROXY:-}
      MUSIC_PROXY: ${MUSIC_PROXY:-}
      # 可选：QQ 音乐会员播放凭据（不要提交到仓库）
      MUSIC_COOKIE: ${MUSIC_COOKIE:-}
      MUSIC_UIN: ${MUSIC_UIN:-}
    volumes:
      # SQLite 数据库文件必须挂卷，否则容器重建数据丢失
      - ./data:/app/data
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
